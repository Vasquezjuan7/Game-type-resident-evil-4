<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dead Echo · Menú principal</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&amp;family=Courier+Prime:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.de-shot{position:absolute;left:180px;top:0;right:0;bottom:0;overflow:hidden;opacity:0;animation:de-fade 30s linear infinite}
.de-s1{animation-delay:0s}.de-s2{animation-delay:10s}.de-s3{animation-delay:20s}
@keyframes de-fade{0%{opacity:0}5%{opacity:1}33%{opacity:1}38%{opacity:0}100%{opacity:0}}
.de-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* toma 1 · niebla: empuje lento de cámara + niebla que cruza */
@keyframes de-push1{0%{transform:scale(1.04) translate(10px,0)}100%{transform:scale(1.16) translate(-30px,-10px)}}
.de-push1{animation:de-push1 30s ease-out infinite alternate}
@keyframes de-fogx{from{transform:translateX(-220px)}to{transform:translateX(220px)}}
.de-fog{position:absolute;border-radius:50%;background:#e9e9e4;filter:blur(40px);animation:de-fogx 18s ease-in-out infinite alternate}
/* toma 2 · bosque de noche: respiración + luz de linterna que titila */
@keyframes de-breathe{0%,100%{transform:scale(1.08) translateY(0)}50%{transform:scale(1.1) translateY(-4px)}}
.de-breathe{animation:de-breathe 5s ease-in-out infinite}
@keyframes de-torch{0%,100%{opacity:.0}8%{opacity:.35}9%{opacity:.05}11%{opacity:.4}40%{opacity:.15}62%{opacity:.5}63%{opacity:.1}64%{opacity:.45}}
.de-torch{animation:de-torch 6s steps(1) infinite}
@keyframes de-mist{from{transform:translateX(120px)}to{transform:translateX(-120px)}}
.de-mist{position:absolute;left:-100px;right:-100px;bottom:-40px;height:260px;background:radial-gradient(ellipse at 50% 100%,rgba(110,120,135,.45),rgba(0,0,0,0) 70%);animation:de-mist 22s ease-in-out infinite alternate}
/* toma 3 · fuego: brillo que palpita + brasas que suben */
@keyframes de-drift3{0%{transform:scale(1.08) translate(-20px,0)}100%{transform:scale(1.12) translate(20px,-8px)}}
.de-drift3{animation:de-drift3 30s ease-in-out infinite alternate}
@keyframes de-fire{0%,100%{opacity:.35}20%{opacity:.6}35%{opacity:.4}55%{opacity:.7}75%{opacity:.45}}
.de-fire{animation:de-fire 2.2s ease-in-out infinite}
@keyframes de-ember{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(-60px,-420px);opacity:0}}
.de-ember{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffb25a;box-shadow:0 0 6px #ff8a2a;animation:de-ember 6s linear infinite}
@keyframes de-grain{0%{transform:translate(0,0)}25%{transform:translate(-40px,20px)}50%{transform:translate(30px,-30px)}75%{transform:translate(-20px,40px)}100%{transform:translate(0,0)}}
.de-grain{animation:de-grain .6s steps(4) infinite}
@keyframes de-echo{0%{transform:translateX(0);opacity:.35}100%{transform:translateX(26px);opacity:0}}
.de-echo{animation:de-echo 3.2s ease-out infinite}
.de-echo2{animation-delay:1.6s}
@keyframes de-flick{0%,94%,100%{opacity:0}95%{opacity:.25}96%{opacity:0}97%{opacity:.15}}
.de-flick{animation:de-flick 9s infinite}
.de-item{all:unset;cursor:pointer;position:relative;display:flex;align-items:center;min-height:36px;padding:0 14px;font:400 17px 'Courier Prime',monospace;color:#9a968d;letter-spacing:.01em}
.de-item:hover{color:#ece8de}
.de-item-on{color:#fff;font-weight:700}
@media (prefers-reduced-motion:reduce){.de-shot,.de-push1,.de-fog,.de-breathe,.de-torch,.de-mist,.de-drift3,.de-fire,.de-ember,.de-grain,.de-echo,.de-flick{animation:none}}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #0c0c0b; color: #ece8de">
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <filter id="de-rough"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="9"></feDisplacementMap></filter>
      <filter id="de-rough2"><feTurbulence type="fractalNoise" baseFrequency="0.05 0.6" numOctaves="3" seed="9"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="14"></feDisplacementMap></filter>
    </defs>
  </svg>

  <!-- TOMA 1 · Soldado en la niebla -->
  <div class="de-shot de-s1" aria-hidden="true">
    <div class="de-push1" style="position: absolute; inset: 0"><img class="de-img" src="../referencias/zombie_01_niebla.jpg" alt="" style="object-position: 45% 30%; filter: saturate(.35) contrast(1.08) brightness(.9)"></div>
    <div class="de-fog" style="left: -120px; top: 380px; width: 900px; height: 260px; opacity: .45"></div>
    <div class="de-fog" style="left: 300px; top: -60px; width: 700px; height: 220px; opacity: .3; animation-duration: 26s; animation-direction: alternate-reverse"></div>
  </div>

  <!-- TOMA 2 · Bosque de noche -->
  <div class="de-shot de-s2" aria-hidden="true">
    <div class="de-breathe" style="position: absolute; inset: 0"><img class="de-img" src="../referencias/zombie_02_bosque_noche.jpg" alt="" style="object-position: 35% 28%; filter: saturate(.4) contrast(1.1) brightness(.75)"></div>
    <div class="de-torch" style="position: absolute; inset: 0; background: radial-gradient(circle 260px at 40% 35%, rgba(255,245,225,.55), rgba(0,0,0,0) 70%); mix-blend-mode: soft-light"></div>
    <div class="de-mist"></div>
  </div>

  <!-- TOMA 3 · Calle en llamas -->
  <div class="de-shot de-s3" aria-hidden="true">
    <div class="de-drift3" style="position: absolute; inset: 0"><img class="de-img" src="../referencias/zombie_03_fuego.jpg" alt="" style="object-position: 60% 40%; filter: saturate(.45) contrast(1.08) brightness(.82)"></div>
    <div class="de-fire" style="position: absolute; inset: 0; background: radial-gradient(ellipse 50% 60% at 85% 50%, rgba(255,120,30,.55), rgba(0,0,0,0) 70%); mix-blend-mode: screen"></div>
    <span class="de-ember" style="left: 700px; top: 560px"></span><span class="de-ember" style="left: 820px; top: 620px; animation-delay: -1.5s"></span><span class="de-ember" style="left: 760px; top: 500px; animation-delay: -3s; width: 2px; height: 2px"></span><span class="de-ember" style="left: 900px; top: 600px; animation-delay: -4.2s"></span><span class="de-ember" style="left: 640px; top: 660px; animation-delay: -2.4s; width: 2px; height: 2px"></span><span class="de-ember" style="left: 860px; top: 460px; animation-delay: -5s"></span>
  </div>

  <!-- capas de lente -->
  <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,8,7,1) 0%, rgba(8,8,7,.95) 26%, rgba(8,8,7,.55) 42%, rgba(8,8,7,0) 62%)"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(ellipse 80% 75% at 62% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.85) 100%)"></div>
  <div aria-hidden="true" style="position: absolute; inset: -60px; overflow: hidden; opacity: .16; mix-blend-mode: screen"><svg class="de-grain" width="1400" height="840"><filter id="de-noise"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="1400" height="840" filter="url(#de-noise)"></rect></svg></div>
  <div class="de-flick" aria-hidden="true" style="position: absolute; inset: 0; background: #000; opacity: 0"></div>

  <!-- línea vertical rayada -->
  <svg aria-hidden="true" width="20" height="720" style="position: absolute; left: 38px; top: 0"><path d="M10 0 L10 720" stroke="#d8d4ca" stroke-width="2.4" stroke-dasharray="120 6 40 3 200 8 60 4 300" opacity=".75" style="filter: url(#de-rough2)"></path></svg>

  <!-- logo -->
  <div style="position: absolute; left: 92px; top: 112px; width: 420px">
    <svg aria-hidden="true" width="420" height="12" style="display: block"><path d="M0 6 L404 6" stroke="#d8d4ca" stroke-width="1.6" stroke-dasharray="60 3 90 2 40 4 200" opacity=".8"></path><circle cx="410" cy="6" r="3" fill="#f1eee6"></circle></svg>
    <h1 style="margin: 30px 0 0; font: 400 34px 'Special Elite', monospace; letter-spacing: 0.28em; color: #f1eee6; padding-left: 52px">DEAD</h1>
    <div style="position: relative; margin-top: 2px; width: 400px; height: 82px">
      <svg aria-hidden="true" width="400" height="82" viewBox="0 0 400 82" style="position: absolute; inset: 0"><path d="M6 22 Q60 10 140 14 L300 10 Q360 8 392 18 L384 30 L396 44 L386 58 Q330 72 220 70 L90 74 Q30 76 10 64 L18 50 L2 38 Z" fill="#efebe2" style="filter: url(#de-rough)"></path></svg>
      <span class="de-echo" aria-hidden="true" style="position: absolute; left: 70px; top: 12px; font: 400 52px 'Special Elite', monospace; letter-spacing: 0.32em; color: #efebe2">echo</span>
      <span class="de-echo de-echo2" aria-hidden="true" style="position: absolute; left: 70px; top: 12px; font: 400 52px 'Special Elite', monospace; letter-spacing: 0.32em; color: #efebe2">echo</span>
      <span style="position: absolute; left: 70px; top: 12px; font: 400 52px 'Special Elite', monospace; letter-spacing: 0.32em; color: #121211">echo</span>
      <span aria-hidden="true" style="position: absolute; left: 50px; top: 16px; width: 3px; height: 50px; background: #121211"></span>
      <span aria-hidden="true" style="position: absolute; right: 44px; top: 18px; width: 3px; height: 46px; background: #121211"></span>
    </div>
  </div>

  <!-- menú -->
  <nav aria-label="Menú principal" style="position: absolute; left: 92px; top: 300px; display: flex; flex-direction: column; gap: 2px">
    <button class="de-item de-item-on"><svg aria-hidden="true" width="210" height="34" viewBox="0 0 210 34" style="position: absolute; left: 0; top: 1px"><path d="M2 8 L196 4 L206 12 L198 20 L204 28 L6 30 L0 20 Z" fill="#0a0a09" opacity=".92" style="filter: url(#de-rough)"></path></svg><span style="position: relative">Continuar</span></button>
    <button class="de-item"><span aria-hidden="true" style="position: absolute; left: 2px; width: 4px; height: 4px; border-radius: 50%; background: #c9c4b8"></span>Nueva partida</button>
    <button class="de-item">Opciones</button>
    <button class="de-item">Créditos</button>
    <button class="de-item">Salir</button>
  </nav>

  <!-- pie -->
  <div style="position: absolute; left: 106px; bottom: 44px; font-family: 'Courier Prime', monospace; color: #e4e0d6">
    <p style="margin: 0 0 8px; font-size: 15px">Retoma la investigación desde tu último guardado.</p>
    <p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #b8b3a8"><span style="display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: #d8d4ca; color: #111; font-size: 11px; font-weight: 700">↵</span>Confirmar</p>
  </div>
  <div style="position: absolute; right: 48px; top: 34px; width: 240px; text-align: right; font-family: 'Courier Prime', monospace; font-size: 14px; color: #ece8de"><svg aria-hidden="true" width="240" height="4" style="display: block; margin-bottom: 8px"><path d="M0 2 L240 2" stroke="#d8d4ca" stroke-width="1" opacity=".7"></path></svg>[USUARIO]</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
